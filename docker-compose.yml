# Despliegue de SERVIDOR (staging/producción). NO usar para desarrollo local
# (ver docs/26_infraestructura.md §26.10 y docs/27_docker.md). En local: MariaDB
# y Node nativos + `pnpm dev`.

services:
  nginx:
    image: nginx:alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certs:/etc/nginx/certs:ro
    depends_on: [web, admin, api]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # `web` sí hace fetch en Server Components durante `next build` (prerender
      # estático de /, /servicios, etc.) — necesita alcanzar `api` por la red de
      # Compose durante el build, no solo en runtime (ver apps/web/Dockerfile).
      network: default
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER}
        # Nombre interno fijo del servicio `api` en esta misma red de Compose.
        API_INTERNAL_URL: "http://api:3001/api/v1"
    env_file: .env.web
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    env_file: .env.admin
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env.api
    # `default` (implícito, para hablar con nginx/web/admin) + `backend`
    # (para llegar a MariaDB) — el único servicio que necesita esa red.
    networks:
      - default
      - backend
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  mariadb:
    image: mariadb:11.8.8
    container_name: funeraria-mariadb
    networks:
      - backend
    env_file: .env.mariadb
    volumes:
      - /srv/funeraria/mariadb:/var/lib/mysql
    # Collation obligatoria del proyecto (ADR-002 / docs/11): NO utf8mb4_0900_ai_ci.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_uca1400_ai_ci
    # NO exponer el puerto de MariaDB al host en producción.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  # `internal: true`: sin ruta a internet ni a ninguna otra red — solo lo que
  # esté explícitamente conectado a `backend` (hoy, únicamente `api`) puede
  # alcanzar a MariaDB. Ni `web`, ni `admin`, ni `nginx` tienen ruta de red
  # hacia la base de datos. Nombre fijo (`name:`) para que comandos operativos
  # puntuales (p. ej. el seed inicial, ver DEPLOYMENT.md) no dependan de
  # adivinar el nombre real según el directorio/proyecto de Compose.
  backend:
    name: funeraria_backend
    internal: true

volumes:
  certs:
