# Despliegue de SERVIDOR (staging/producción). NO usar para desarrollo local
# (ver docs/26_infraestructura.md §26.10 y docs/27_docker.md). En local: MariaDB
# y Node nativos + `pnpm dev`.
#
# MariaDB NO vive en este archivo — se despliega por separado desde
# docker/mariadb/docker-compose.yml (vida útil y red propias, aislada de
# internet con `internal: true`; ver ADR en docs/34_decisiones_arquitectonicas.md).
# Ese compose debe estar arriba y sano ANTES de levantar `api` acá — Compose
# no puede expresar `depends_on` entre archivos/proyectos distintos, así que
# el orden es responsabilidad del operador (ver DEPLOYMENT.md).

networks:
  backend:
    external: true
    name: funeraria_backend

services:
  nginx:
    image: nginx:alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certs:/etc/nginx/certs:ro
    depends_on: [web, admin, api]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # `web` sí hace fetch en Server Components durante `next build` (prerender
      # estático de /, /servicios, etc.) — necesita alcanzar `api` por la red de
      # Compose durante el build, no solo en runtime (ver apps/web/Dockerfile).
      network: default
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER}
        # Nombre interno fijo del servicio `api` en esta misma red de Compose.
        API_INTERNAL_URL: "http://api:3001/api/v1"
    env_file: .env.web
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    env_file: .env.admin
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env.api
    # `default` (implícito, para hablar con nginx/web/admin) + `backend`
    # (externa, para llegar a MariaDB) — el único servicio de este archivo
    # que necesita la red de MariaDB.
    networks:
      - default
      - backend
    restart: unless-stopped

volumes:
  certs:
